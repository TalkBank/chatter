[package]
name = "chatter-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Desktop validation app for CHAT files"
publish = false

[lib]
name = "chatter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doc examples, and rustdoc charges a full compile per crate whether or not
# there are any: measured at 22-23 s each, against 18.4 s of ACTUAL doctest
# execution across the entire workspace. Skipping the two application crates
# that have none takes about a minute off every gate run and every CI run.
#
# The cost, stated because it is silent: a doc example added here later would
# never run, locally or in CI. That is an acceptable trade for an app shell and
# an API client, and NOT for the library crates, which keep their doctests.
doctest = false

[[bin]]
name = "chatter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Auto-update: the updater plugin checks the GitHub Releases latest.json and
# installs signed update bundles; the process plugin's relaunch() restarts the
# app into the new version after install. See
# docs/strategy/distribution-and-signing.md "Auto-update".
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Domain error types for the command surface (errors.rs); replaced the
# `Result<_, String>` every command used to return.
thiserror = { workspace = true }
crossbeam-channel = "0.5"
arc-swap = "1.9"
ansi-to-html = "0.2"
# ValidationState's per-config cache-pool map (cache_for_config), the same
# concurrent-map idiom talkbank-lsp's backend state uses; this crate's coding
# standard bans an explicit mutex, and DashMap's sharded internal locking is
# the sanctioned alternative.
dashmap = { workspace = true }

# Used by commands.rs for the cache path. On macOS/Linux this happens
# to resolve through Tauri's transitive dep tree, but on Windows the
# tree differs and the compile fails (E0433 'cannot find crate dirs').
# Declared explicitly so the build works on every target.
dirs = { workspace = true }

# Workspace crates (relative paths to sibling crates)
talkbank-transform = { workspace = true }
talkbank-model = { workspace = true }
send2clan = { workspace = true }

[dev-dependencies]
# Recursive walk of corpus/reference/ in validation_bridge.rs, so the
# reference-corpus integration test derives its expected file count from
# disk instead of hardcoding a literal that breaks on every fixture add.
walkdir = { workspace = true }
# `repo_paths::workspace_root()`, so this crate's test binaries do not carry a
# third hand-written root-finder. That module exists BECAUSE the workspace
# accumulated fifteen of them in three flavours that disagreed; adding a
# sixteenth here, in a file whose own comment cited that history, would have
# been the joke writing itself. Dev-only: no release-binary cost.
talkbank-parser-tests = { path = "../../../crates/talkbank-parser-tests" }

[lints]
workspace = true
