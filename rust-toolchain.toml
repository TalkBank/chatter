[toolchain]
# Track the current stable Rust release (decided 2026-10-01, replacing a
# numeric pin). A new stable can bring new clippy lints; the weekly
# clippy-rolling.yml run surfaces them within days of a release, and they
# are fixed in a focused commit. rustfmt's output is stable within a style
# edition, so a release does not move the generated traversal (the pin never
# caught such a change across 1.96 to 1.98). This file still owns the
# components and targets below.
channel = "stable"
# `llvm-tools` is here for the same reason `targets` is below: coverage is
# the completeness criterion for the test suite, and a criterion that needs
# a human to remember a rustup command is one nobody measures.
components = ["rustfmt", "clippy", "llvm-tools"]
# Declared so rustup INSTALLS it, rather than a runbook asking a human to
# remember. `just wasm-check` needs it, and on the 1.98.0 bump a
# `--profile minimal` install of the new toolchain carried only the host
# target, so the gate failed with "can't find crate for `core`", which reads
# like a broken toolchain and is a missing target. Same mechanism as
# `components` above; ci.yml's wasm job names the target separately, and this
# is the owner.
targets = ["wasm32-unknown-unknown"]
