[package]
name = "talkbank-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Language Server Protocol server for TalkBank CHAT"
readme = "README.md"
# Hold back crates.io publication until the Wave 1B editor/support contract lands.
publish = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dashmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
talkbank-model = { workspace = true }
tree-sitter-highlight = { workspace = true }
talkbank-parser = { workspace = true }
thiserror = { workspace = true } #unified
tokio = { workspace = true }
tower-lsp = { workspace = true }
tracing = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-talkbank = { workspace = true }

[[bin]]
name = "talkbank-lsp"
path = "src/bin/talkbank-lsp.rs"

[dev-dependencies]
insta = { workspace = true }

# This crate finished its panic-site audit on 2026-04-29 (see
# `docs/panic-audit/talkbank-lsp.md`). The 6 non-test panic shapes are
# all classified as infallible-by-construction with explicit
# `#[allow]` annotations carrying rationales; new sites are now
# blocked from landing without a deliberate opt-in.
#
# The lints reach this crate through the workspace table, and the stanza below
# is what makes that true.
#
# This comment described a crate-local table that INLINED the workspace lints
# and promoted the panic family to `deny` here. That table is gone (the clippy
# policy was unified into one pass) and no opt-in replaced it, so this crate
# was outside the panic policy entirely while a five-line comment explained how
# strictly it was covered. The workspace table denies the panic family for
# everyone now, so there is nothing left to promote.

[lints]
workspace = true

[package.metadata.dist]
# Shipped as a standalone, first-class release artifact: the LSP server is
# valuable to any LSP-aware editor (not only the VS Code extension, which bundles
# it per platform). cargo-dist builds + code-signs `talkbank-lsp` for the same
# five targets as the `chatter` CLI, so editors get a signed binary that passes
# macOS Gatekeeper. Opted in for v0.2.1 (was held back through v0.2.0 while the
# CLI shipped alone as the first user-visible artifact).
dist = true
