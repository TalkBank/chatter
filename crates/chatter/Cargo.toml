[package]
name = "chatter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for TalkBank CHAT validation, conversion, and analysis"
readme = "README.md"
# CLI registry installation is required alongside binary distribution.
# Keep cargo-dist participation explicit independently of registry publication.
[package.metadata.dist]
dist = true

[[bin]]
name = "chatter"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
axoupdater = { workspace = true }
jiff = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
crossterm = { workspace = true }
ctrlc = { workspace = true }
dirs = { workspace = true }
indicatif = { workspace = true }
notify = { workspace = true }
ratatui = { workspace = true }
send2clan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
talkbank-llm = { workspace = true }
talkbank-model = { workspace = true }
talkbank-transform = { workspace = true }
talkbank-parser = { workspace = true }
thiserror = { workspace = true } #unified
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# TEST-ONLY. It was a regular dependency until 2026-08-19, because `new-file`
# used a template that lived here, so this test-support crate compiled into the
# release binary.
# Test helpers are never published; omit this edge from the registry manifest.
talkbank-parser-tests = { path = "../talkbank-parser-tests" }
# TEST-ONLY. `RuleProfile::cli_flag` names the flag a generated error page tells
# readers to pass; only a test that sees both that table and clap's `long` can
# hold them equal, and this is the one crate that does.
talkbank-spec-vocabulary = { path = "../../spec/vocabulary" }
assert_cmd = { workspace = true }
httpmock = "0.8.3"
predicates = { workspace = true }
serde_json = { workspace = true }

# Panic-site audit completed 2026-04-29 (see
# `docs/panic-audit/chatter.md`). 14 non-test sites annotated.

[lints]
workspace = true
