[package]
name = "talkbank-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "OpenAI-compatible HTTP JudgmentProvider for talkbank-transform (the only network-dependent crate in the toolchain)"

[lib]
# No doc examples, and rustdoc charges a full compile per crate whether or not
# there are any: measured at 22-23 s each, against 18.4 s of ACTUAL doctest
# execution across the entire workspace. Skipping the two application crates
# that have none takes about a minute off every gate run and every CI run.
#
# The cost, stated because it is silent: a doc example added here later would
# never run, locally or in CI. That is an acceptable trade for an app shell and
# an API client, and NOT for the library crates, which keep their doctests.
doctest = false

[dependencies]
talkbank-transform = { workspace = true }
ureq = "3.4.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
httpmock = "0.8.3"
serde_json = { workspace = true }
tempfile = { workspace = true }
# The integration tests construct a JudgmentRequest, whose `anchor` field is a
# talkbank_model::SpeakerCode, so the test crate names talkbank-model directly.
talkbank-model = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# This crate is new: no legacy panic sites to grandfather, so the panic-discipline
# lints are denied outright (matching talkbank-cache, the other post-audit crate).
