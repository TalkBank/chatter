[package]
name = "talkbank-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SQLite-backed pass/fail cache for CHAT validation and roundtrip results"
readme = "README.md"

[dependencies]
blake3 = { workspace = true }
dirs = { workspace = true }
# The database file's modification time is admitted as a `jiff::Timestamp`
# when it is read, so a time outside jiff's range is refused there rather
# than in every renderer.
jiff = { workspace = true }
sqlx = { workspace = true }
# The cache key folds in a fingerprint of the active validation rule set so that
# changing the rules (e.g. adding error code E370) invalidates stale entries.
# That fingerprint is owned by talkbank-model (the codes ARE the rule set).
talkbank-model = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# `RulesVersion::for_testing`: a version from a label, for tests that model a
# rule-set change without recompiling. Off in every production build, so no
# production caller can name a version that no rule set produced; this
# crate's own tests turn it on through the dev-dependency below.
test-support = []

[dev-dependencies]
talkbank-cache = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# Panic-site audit completed 2026-04-29 (inherited from talkbank-transform's
# audit when this crate was extracted).

[lints]
workspace = true
