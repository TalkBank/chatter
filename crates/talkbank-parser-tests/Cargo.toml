[package]
name = "talkbank-parser-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared parser test harness and fixtures"
publish = false

[dependencies]
clap = { workspace = true }
comrak = { workspace = true }
insta = { workspace = true, features = ["json"] }
regex = { workspace = true } #unified
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shellexpand = { workspace = true }
# `syn` parses the generated typed CST traversal to derive the mechanical
# conformance inventory (see `conformance_inventory`). This crate is
# `publish = false` test infrastructure, so a normal (non-dev) dep is fine and
# lets the guard test call the generator's core function directly.
syn = { workspace = true }
talkbank-model = { workspace = true }
talkbank-parser = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true } #unified
tree-sitter = { workspace = true }
tree-sitter-talkbank = { workspace = true }
walkdir = { workspace = true } #unified

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }
rstest = { workspace = true }
sha2 = "0.11"
talkbank-transform = { workspace = true }

[lints]
workspace = true

# These binaries are analysis and audit TOOLS, not tests. Without
# `test = false` cargo builds and LAUNCHES each one during `cargo test`
# purely to run zero tests, which on macOS also pays a per-binary
# first-execution assessment. Declared explicitly so the cost is visible.
# `bootstrap_spec_examples` is omitted deliberately: it DOES carry tests.
#
# The flag is target SELECTION, not a note about cost, and that has bitten
# once: it also excludes a target from the set `--tests` chooses, so a
# `#[test]` written inside one of these bins passes under `--bins` and is
# invisible to the command CI runs. The answer is NOT to flip the flag per
# bin. A bin that needs a gate puts its logic in a library module and its
# assertion in `tests/integration/`, the way `conformance_inventory` and
# `content_catch_alls` do; then this rule stays uniform and nobody has to
# reason about cargo target selection to be sure a check runs.

[[bin]]
name = "audit_content_catch_alls"
path = "src/bin/audit_content_catch_alls.rs"
test = false

[[bin]]
name = "audit_check_parity"
path = "src/bin/audit_check_parity.rs"
test = false

[[bin]]
name = "audit_error_codes"
path = "src/bin/audit_error_codes.rs"
test = false

[[bin]]
