[package]
name = "talkbank-transform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "TalkBank CHAT transform and conversion pipelines"
readme = "README.md"

[features]
default = ["validation-runner"]
# The corpus-scale validation runner and its SQLite result cache. This is the
# only part of the crate that needs a SQL stack (sqlx, via talkbank-cache),
# so consumers that want the transform surface alone can opt out with
# `default-features = false`. crossbeam-channel and num_cpus are runner-only
# too and ride the same feature.
validation-runner = ["dep:talkbank-cache", "dep:crossbeam-channel", "dep:num_cpus"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
crossbeam-channel = { workspace = true, optional = true }
jsonschema = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
num_cpus = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
smol_str = { workspace = true }
talkbank-cache = { workspace = true, optional = true }
talkbank-model = { workspace = true }
talkbank-parser = { workspace = true }
talkbank-parser-re2c = { workspace = true }
thiserror = { workspace = true } #unified
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
# Enables `ChatCleanedText::test_unchecked` for test fixture
# construction. Production builds of this crate cannot reach the
# escape hatch.
# Path-only (no version) ON PURPOSE: cargo strips version-less dev-deps
# from the published manifest, so this test-utils edge cannot block
# `cargo publish` regardless of wave order. Gated by
# scripts/release/check-foundation-publication-readiness.sh.
talkbank-model = { path = "../talkbank-model", features = ["test-utils"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# Panic-site audit completed 2026-04-29 (see
# `docs/panic-audit/talkbank-transform.md`).
