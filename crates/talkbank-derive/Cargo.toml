[package]
name = "talkbank-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Procedural macros for TalkBank CHAT model crates"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
# Path-only (no version) ON PURPOSE: cargo strips version-less dev-deps
# from the published manifest, so this intentional test-only cycle onto a
# sibling not yet on the registry cannot block `cargo publish`. Gated by
# scripts/release/check-foundation-publication-readiness.sh.
talkbank-model = { path = "../talkbank-model" }
serde = { workspace = true }
schemars = { workspace = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
