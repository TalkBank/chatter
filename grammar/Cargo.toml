[package]
name = "tree-sitter-talkbank"
description = "Tree-sitter grammar for TalkBank CHAT transcripts"
version = "0.1.0"
authors = ["Franklin Chen <franklinchen@franklinchen.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "talkbank"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/TalkBank/chatter"
homepage = "https://talkbank.org"
edition.workspace = true
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.4"

[dev-dependencies]
tree-sitter = "0.27.0"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# The grammar crate's hand-written Rust is `bindings/rust/`; `src/parser.c` is
# generated C that these lints do not reach. Opting in anyway, so the answer to
# "is this crate covered" is the same for every package in the workspace and
# nobody has to remember an exception.
[lints]
workspace = true
