[book]
title = "Chatter: TalkBank CHAT Toolchain"
authors = ["TalkBank Contributors"]
description = "User, developer, and architecture documentation for chatter: the CHAT format authority, validator, transformer, and LSP."
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Git-derived "last changed" dates: `{{git-dates:page}}` and `{{git-dates:book}}`
# are substituted wherever a page uses them, and every page gets a footer with
# both. mdBook runs preprocessors with the book directory as cwd, hence `..`.
# Needs full git history (refuses a shallow clone). `just book` verifies the
# rendered front page carries the same dates git reports.
[preprocessor.git-dates]
command = "python3 ../scripts/mdbook_git_dates.py"


[output.html]
git-repository-url = "https://github.com/TalkBank/chatter"
edit-url-template = "https://github.com/TalkBank/chatter/edit/main/book/{path}"
# Served from https://talkbank.github.io/chatter/ once Pages is enabled at the
# public cutover; site-url makes absolute in-book links resolve under the subpath.
site-url = "/chatter/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
