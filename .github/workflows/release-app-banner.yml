name: Release app banner

# After dist's announce step has published a release (with the desktop .dmg /
# .exe already attached by the desktop publish job), prepend a "Most people want
# the app" banner to its notes so the GitHub release page leads non-programmers
# to the desktop app (not the curl command and the command-line tarball table).
# The script is idempotent.
#
# Called by the generated release workflow as a dist post-announce job
# (`post-announce-jobs` in dist-workspace.toml). It used to listen for a
# push-triggered "Release Desktop" run, but desktop now runs inside the release
# workflow, so that event never occurs.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  banner:
    name: Prepend app banner to the release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepend app banner
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag dist announced; the script validates its shape before using it.
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: bash scripts/release/add_app_banner.sh "$TAG"
