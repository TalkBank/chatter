name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Group runs by workflow + ref. The conditional cancel-in-progress
# expression was confusing in practice (cancelling main-branch runs
# when I'd expected only PR runs). Simpler and clearer: always allow
# every push to main to run, even if a faster one supersedes it. PRs
# can be re-triggered by pushing the branch again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default. Individual jobs can grant more if they need to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Book toolchain. mdBook + mdbook-mermaid are pinned to current, kept in
  # lockstep with book.yml and the justfile. The mermaid preprocessor rewrites
  # fenced blocks; the mermaid assets render them via book.toml additional-js.
  # Link-checking is decoupled onto lychee (runs on the built HTML).
  MDBOOK_VERSION: '0.5.3'
  MDBOOK_MERMAID_VERSION: '0.17.0'
  LYCHEE_VERSION: '0.24.2'

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Pinned in lockstep with rust-toolchain.toml (channel =
      # "1.97.1"). Drift against latest-stable is caught by the
      # weekly .github/workflows/clippy-rolling.yml job; bump this
      # action version + the rust-toolchain.toml channel together
      # when that job goes red.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      # The chatter-desktop Tauri crate links against GTK / webkit /
      # libsoup on Linux. If Tauri-on-Linux maintenance starts costing
      # more than it earns, move chatter-desktop into a workspace that's
      # excluded from default workspace build.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct caches per job so the rust and book jobs don't
          # invalidate each other.
          shared-key: rust-job
          # BOTH workspaces. The action's default is `. -> target`, which
          # caches the root only, and `spec/` is a separate workspace with its
          # own target dir and 207 locked dependencies (oxc, tera, comrak,
          # tree-sitter). Without this line the spec test step below rebuilds
          # every one of them from source on every push and PR, forever.
          #
          # Deliberately NOT sharing one CARGO_TARGET_DIR between the two
          # workspaces, which would also dedupe the crates they have in common.
          # Two workspaces can resolve different features for a shared
          # dependency, and then they evict each other's artifacts on every
          # alternation. That is the exact trap measured in `check-feature-off`
          # on 2026-08-04 (201 crate rebuilds per alternation); a cold cache is
          # cheaper than a thrashing one.
          workspaces: |
            . -> target
            spec -> spec/target

      # Both workspaces: `--all` covers the members of ONE workspace, and
      # `spec/` is its own. Checking only the root left spec/ unformatted and
      # unnoticed for as long as it has existed.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo fmt --check (spec workspace)
        run: cargo fmt --manifest-path spec/Cargo.toml --all -- --check

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      # `timeout-minutes` bounds a hung test; the runner is ephemeral, so a
      # hung process cannot outlive the job.
      - name: cargo test --workspace
        timeout-minutes: 30
        run: cargo test --workspace --tests --locked

      - name: cargo test --doc --workspace
        timeout-minutes: 15
        run: cargo test --doc --workspace --locked

      # The spec workspace was NEVER built or tested by CI until 2026-08-04,
      # in any job. It is not peripheral: `spec/tools` generates the
      # tree-sitter corpus tests, the Rust parser tests and the validation
      # fixture corpus, so a break here silently stops the regeneration that
      # every one of those gates depends on. `--workspace` covers one
      # workspace, and this is a second one.
      - name: cargo test (spec workspace)
        timeout-minutes: 15
        run: cargo test --manifest-path spec/Cargo.toml --workspace --locked

      # The trybuild UI suite is `#[ignore]`d without this feature, because it
      # spawns a cargo build per fixture and is over half of the workspace's
      # whole test execution time. CI is exactly where it should run.
      - name: cargo test (proc-macro UI suite)
        timeout-minutes: 15
        run: cargo test -p talkbank-derive --features ui-tests --tests ui_tests --locked

      # Single-pass clippy (unified 2026-07-08). Production strictness
      # lives in the workspace [lints] deny table; test relaxation
      # lives in source (crate-root cfg_attr for unit tests, an
      # #![allow] header in each tests/*.rs). One flag set means one
      # build profile and a policy readable entirely from source.
      #
      # CI is the ONLY place clippy runs routinely: the local
      # developer loop and the pre-push gate deliberately skip it
      # (correctness is gated locally by tests; style/policy audit is
      # async here). A red clippy on main is a fix-forward cosmetic
      # commit, never a revert. Severity is two-tier and readable
      # from the workspace [lints] table alone: the panic-family
      # policy lints are deny (a violation of the no-panics house
      # rule is the ONLY thing that turns this job red); every other
      # lint surfaces as a warning annotation for leisure triage.
      # Drift pulse: the weekly clippy-rolling.yml job plus
      # opportunistic session sweeps (advisory lint rotted to ~100
      # warnings once before, 2026-05-29; leisure needs a pulse).
      - name: cargo clippy (single pass; red only on panic-policy denies)
        run: just clippy
      # The spec workspace had fmt and test in CI but NEVER clippy, so its
      # lint debt accumulated unseen: 20 warnings by 2026-08-05, all
      # machine-applicable, in the tooling that GENERATES the corpus tests,
      # the parser tests and the validation fixtures. Same two-tier severity
      # as the main pass above; this exists so the count cannot silently
      # climb again.
      - name: cargo clippy (spec workspace)
        run: just clippy-spec
  # Pins the wasm-cleanliness contract: talkbank-model and the pure-Rust
  # re2c parser must keep compiling for wasm32 (no C toolchain, no
  # tree-sitter runtime). External consumers depend on exactly this
  # split to run CHAT parsing under Pyodide/emscripten, selecting the
  # re2c backend through the shared ChatParser trait on wasm targets.
  wasm:
    name: wasm32 check (model + re2c parser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Same lockstep pin as the rust job above.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-job

      - name: Check wasm32 compilation
        run: just wasm-check
  book:
    name: mdBook build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target (book tooling)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: book-job

      - name: Install mdbook + mdbook-mermaid + lychee
        run: |
          cargo install \
            mdbook@"${MDBOOK_VERSION}" \
            mdbook-mermaid@"${MDBOOK_MERMAID_VERSION}" \
            lychee@"${LYCHEE_VERSION}" \
            --locked

      - name: mdbook build
        run: cd book && mdbook build

      - name: Link-check book (lychee, offline)
        run: lychee --offline --root-dir "${GITHUB_WORKSPACE}/book/build" "${GITHUB_WORKSPACE}/book/build"

  rust-version-sync:
    name: Rust version pins in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # check_doc_dates.py needs per-file commit dates, so it refuses to
          # run on a shallow clone rather than passing vacuously.
          fetch-depth: 0


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Cheap guard (pure Python, no Rust build): every numeric Rust-version
      # pin in the workflows must match its source of truth, the dev toolchain
      # from rust-toolchain.toml or, for the marked MSRV pin, Cargo.toml
      # rust-version. Bumping Rust is then: edit the source file, run
      # `just rust-sync`, and this job enforces no pin was missed.
      - name: Check Rust version pins
        run: just rust-sync-check
      - name: Documentation date headers are honest
        run: just doc-dates
  app-version-sync:
    name: App version in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Cheap guard (pure Python, no build): the app version must match across the
      # canonical [workspace.package] version, tauri.conf.json, package.json, and a
      # CHANGELOG entry. Bumping the version is then: edit Cargo.toml, run
      # `just app-sync`, add a CHANGELOG entry; this job enforces no file was
      # missed. Prevents the desktop bundle-vs-updater version drift that broke the
      # first v0.1.1 desktop release.
      - name: Check app version sync
        run: just app-sync-check
  shellcheck:
    name: Shell scripts (shellcheck, strictest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Every tracked shell script must pass shellcheck at its default
      # (strictest) severity. ubuntu-latest ships shellcheck; the runner finds
      # every *.sh plus shebang scripts via git ls-files. See CLAUDE.md.
      - name: shellcheck all shell scripts
        run: just shellcheck
  grammar:
    name: Grammar (generate staleness, tree-sitter test, queries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: grammar
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v7
        with:
          node-version-file: grammar/.nvmrc

      # Install ONLY the tree-sitter CLI, not the package's full dev tree.
      # `npm ci` here would also build the `tree-sitter` Node BINDING, whose
      # postinstall runs `node-gyp-build` and needs a native toolchain; that
      # binding is only used by the Node-binding tests, which this job does not
      # run. Installing the CLI alone removes a compile step and a whole class
      # of CI-only failure.
      #
      # The version range is read out of `grammar/package.json` rather than
      # written here, so the manifest stays the single source of truth and this
      # job cannot silently drift onto a different generator than developers
      # use. Verified 2026-07-26: the declared `^0.26.11` resolves to 0.26.11,
      # which is what the local CLI runs. A generator skew would make the
      # staleness check below emit spurious diffs, so this matters.
      - name: Install pinned tree-sitter CLI
        run: |
          version=$(node -p "require('./package.json').devDependencies['tree-sitter-cli']")
          echo "installing tree-sitter-cli@${version}"
          npm install -g "tree-sitter-cli@${version}"
          tree-sitter --version

      # DANGER RULE 3 (CLAUDE.md), now actually enforced. `src/parser.c` is
      # GENERATED from `grammar.js`, and a stale parser.c is invisible to every
      # other gate we have: the Rust build compiles whatever parser.c is on
      # disk, so the entire Rust suite happily tests the OLD grammar and passes.
      # `tree-sitter test` does not catch it either. Until 2026-07-26 nothing in
      # the CI that actually runs checked this at all; the check existed only in
      # `grammar/.github/workflows/ci.yml`, which GitHub never executes because
      # workflows are read solely from the repository root. Verified in sync at
      # the time this job was added.
      - name: Generated parser is in sync with grammar.js
        run: |
          tree-sitter generate
          git diff --exit-code src/parser.c src/grammar.json src/node-types.json

      # The grammar's own corpus, including the wild-data-derived
      # marker-density tests under test/corpus/manual/word_markers/ that exist because
      # of the v0.3.3 word-fragmentation regression. 199 parses at time of
      # wiring.
      - name: tree-sitter test
        run: just grammar-test
      # Editor queries reference grammar node types by name, so they rot
      # silently whenever a node is renamed or removed: nothing else reads them.
      # `tree-sitter query` fails if a pattern does not compile against the
      # grammar, which is the property being gated. All four were valid when
      # this job was added.
      - name: Validate highlight and editor queries
        run: |
          for query_file in queries/*.scm; do
            echo "checking $query_file"
            tree-sitter query "$query_file" \
              ../corpus/reference/edge-cases/postcodes-and-gems.cha >/dev/null
          done

  dependency-audit:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7


      # `just` owns every command this workflow runs, so that the local
      # gate and CI cannot describe different checks. See
      # scripts/check_ci_gate_sync.py.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # `deny.toml` has existed since the v0.1.0 release prep but nothing ever
      # ran it, so the license + advisory policy was decorative for months.
      # Wired up 2026-07-26. This matters more here than in most repos: these
      # crates are published to crates.io as libraries, so a
      # license-incompatible or advisory-bearing dependency propagates to every
      # downstream consumer rather than staying our problem.
      #
      # `cargo deny check` runs all four gates (advisories, bans, licenses,
      # sources) and needs only the manifests and the lockfile, not a build, so
      # this job stays fast and needs no cargo cache.
      #
      # Pinned to the floating major `v2` (verified to resolve 2026-07-26;
      # latest release was v2.85.2). The sibling repo uses the tool-named ref
      # `@cargo-deny`; the `@v2` + `tool:` form is the documented one and pins
      # to a real major rather than a moving per-tool ref.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `--locked` is a TOP-LEVEL cargo-deny option, not a `check` subcommand
      # flag: `cargo deny check --locked` fails to parse.
      - name: cargo deny check
        run: just deps-check