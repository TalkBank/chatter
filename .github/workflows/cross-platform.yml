name: Cross-platform

# Cross-platform health check for the Rust build. Runs on push to main
# and nightly via cron. Kept separate from the primary CI workflow so
# platform-specific transient issues (Windows runner flakiness, macOS
# keychain prompts, GitHub-hosted runner image churn) don't block the
# main CI badge. The primary CI on Ubuntu remains the merge gate; this
# workflow is a leading indicator for distribution readiness.

on:
  push:
    branches: [main]
  schedule:
    # 11:00 UTC daily. Catches dependency drift on macOS / Windows
    # toolchains without waiting for the next push.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Tauri's static-runtime shim shadows msvcrt.lib for unrelated workspace
      # doctests. Verify with Cargo's normal dynamic runtime; release packaging
      # retains Tauri's default static runtime in its separate workflow.
      TAURI_CONFIG: '{"build":{"windows":{"staticVCRuntime":false}}}'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The current stable release, as everywhere in this repo. The
      # rust-cache key changes with each new stable, so the first run after a
      # release builds cold on all three OSes: the same one cold build per
      # release that bumping a pin cost.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri Linux system deps. macOS bundles equivalents; Windows
      # uses WebView2 (preinstalled on runner images).
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/tauri-linux-deps

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-platform-${{ matrix.os }}

      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      - name: cargo test --workspace
        timeout-minutes: 30
        run: just test-workspace

      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace --locked
