[package]
name = "generators"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# The spec format's vocabulary, shared with the main workspace.
talkbank-spec-vocabulary = { workspace = true }

# Spec parsing
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
comrak = { workspace = true }
# The error-spec metadata format itself, as of Phase 1b. The SCHEMA lives in
# `talkbank-spec-vocabulary` so both cargo workspaces read one definition; this
# is the deserializer that feeds it.
toml = { workspace = true }

# CLI and file handling
clap = { workspace = true }
walkdir = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
regex = { workspace = true }
chrono = "0.4"
tera = { workspace = true }
unicode-normalization = { workspace = true }

# Tree-sitter (for template generation and CST extraction)
tree-sitter = { workspace = true }
tree-sitter-talkbank = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
