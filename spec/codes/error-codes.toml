# Every error code chatter knows, and every number it must never reuse.
#
# THE SOURCE OF TRUTH for the per-CODE facts: the `ErrorCode` variant,
# its rustdoc, its DiagnosticKind and whether the validator enforces it.
# `crates/talkbank-model/src/errors/codes/generated_error_code.rs` is
# GENERATED from this file; regenerate with `just spec-gen` and ask
# `just spec-check` whether the committed copy is current.
#
# A spec file under `spec/errors/` DOCUMENTS a code: its own name, its
# description and its examples. Several may document one code. None of
# them owns anything in this file.
#
# The schema, with a reason per field, is
# `talkbank_spec_vocabulary::registry`. An unrecognised key is a load
# error, a code or identifier claimed twice is a load error, and a
# retired number brought back is a load error naming its retirement.

# ---------------------------------------------------------------------
# Retired: used once, never reused. Recorded so the rule is enforced
# rather than remembered.
# ---------------------------------------------------------------------

[[retired]]
code = "W210"
reason = "Missing whitespace before content (a glued terminator `hello.`). Retired 2026-07-16 by maintainer ruling: no production code ever emitted it, and real CLAN CHECK accepts the construct."

[[retired]]
code = "W211"
reason = "Missing whitespace after an overlap marker. Retired 2026-07-16 by maintainer ruling: never emitted, and overlap markers hug their content by design, so the shape is valid CA notation."

[[retired]]
code = "W601"
reason = "Empty user-defined tier. RENUMBERED to E756 on 2026-07-16: it always fired as a hard error, so the warning prefix was the bug."

[[retired]]
code = "W602"
reason = "Deprecated %xLABEL. Deleted 2026-07-16: the Phon %x-tier fold routes every known label to a typed tier parser, so the check was dead code."

[[retired]]
code = "W999"
reason = "Generic legacy warning. Retired 2026-07-31: its only reference anywhere was the generated DiagnosticKind arm itself; no emit site ever constructed it."

[[retired]]
code = "E254"
reason = "UndeclaredExplicitWordLanguage. Retired 2026-07-15: an explicit word-level `@s:CODE` deliberately carries no requirement to be declared in `@Languages` (docs/design/2026-07-15-at-s-language-declaration-decision.md part 1)."

[[retired]]
code = "E366"
reason = "Long feature begin/end label mismatch. Retired 2026-07-31 in the spec/ErrorCode divergence closure: its only reference anywhere was the generated DiagnosticKind arm itself; no emit site ever constructed it."

[[retired]]
code = "E369"
reason = "Nonvocal begin/end label mismatch. Retired 2026-07-31, same closure and same reason as E366: no emit site ever constructed it."

[[retired]]
code = "E700"
reason = "Unexpected node in tier content. Retired 2026-07-31 in the spec/ErrorCode divergence closure: no emit site ever constructed it."

[[retired]]
code = "E703"
reason = "Unexpected node in morphology tier. Retired 2026-07-31, same closure and same reason as E700. Distinct from temporal.rs's separate note that E702/E703 are reserved for a strict timeline mode: that never-built feature would need its own new variant, not this number."

[[retired]]
code = "E754"
reason = "LetterFormMultipleLetters. Retired 2026-08-11: it required an `@l` letter form to carry exactly one letter of stem but counted CHARACTERS, and a digraph is one letter written with two (Welsh `ll`, Dutch `ij`, Hungarian `sz`), so it reported a spurious error on valid CHAT and could not do better, never seeing the word's language. CLAN reached the same conclusion four days earlier, retiring its error 76."

[[retired]]
code = "E214"
reason = "Empty scoped annotation content. Retired 2026-08-26, and it had drifted into TWO rules under one number, neither of which could fire. It began as \"bare [*] carries no error code\" and was deliberately DISABLED as leniency Decision 1, because reference files use bare [*] as valid CHAT; its spec file still documented that rule. The code was then reused for \"the scoped-annotation LIST is empty\", which no input reaches: an empty bracket is E316, and the only empty list in the model was the parser wrapping every bare 0, never validated because Action does not implement Validate. AnnotatedContentAnnotations is non-empty by construction now, so the second rule is unrepresentable and the first stays retired. The registry already recorded status = not_implemented."

