[[code]]
code = "E547"
variant = "ConstantHeaderOutOfOrder"
summary = "A constant participant-specific header (`@Birth of`, `@Birthplace of`,\nor `@L1 of`) does not immediately follow the `@ID` block: a changeable\nheader (e.g. `@Comment`, `@Date`) appears between the `@ID` headers and\nthe constant header. Per the CHAT manual these constant headers must\ndirectly follow `@ID`. Corresponds to CLAN CHECK error 127."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E548"
variant = "IdHeaderOutOfOrder"
summary = "An `@ID` header does not immediately follow the `@Participants` /\n`@Options` headers (or another `@ID`): a changeable header such as\n`@Comment` appears between `@Participants`/`@Options` and the `@ID`\nblock. Per the CHAT manual the `@ID` block directly follows\n`@Participants` (and the optional `@Options`). Corresponds to CLAN\nCHECK error 126."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E549"
variant = "DuplicateSpeakerDeclaration"
summary = "The same speaker code is declared more than once in the `@Participants`\nheader. Each participant must be declared exactly once. Corresponds to\nCLAN CHECK error 13."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E550"
variant = "TrailingCommaInParticipants"
summary = "The `@Participants` header ends with a trailing comma (a stray comma\nafter the last participant, with no participant following it). The\nparticipant list is comma-separated, so a trailing comma is a dangling\nseparator rather than an empty header. Corresponds to CLAN CHECK error\n100 (\"Commas at the end of PARTICIPANTS tier are not allowed\")."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E551"
variant = "OptionsHeaderOutOfOrder"
summary = "The `@Options` header does not immediately follow the `@Participants`\nheader. Per the CHAT spec the optional `@Options` line, when present,\nmust sit directly after `@Participants`, before the `@ID` block or any\nother header. An `@Options` whose immediately-preceding header is\nsomething else (e.g. an `@ID` or `@Comment`), once `@Participants` has\nbeen seen, is an ordering violation. Corresponds to CLAN CHECK error 125\n(\"\\\"@Options\\\" header must immediately follow \\\"@Participants:\\\" header\")."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E552"
variant = "MediaUnlinkedWithTiming"
summary = "The `@Media` header declares `unlinked` status, yet the transcript\ncontains timing bullets. `unlinked` means the media file exists but its\nutterances have not been aligned to timestamps; the presence of timing\nbullets contradicts that, so the `unlinked` qualifier must be removed\n(the media is in fact linked). This is the inverse of\n[`MediaLinkageWithoutTiming`](Self::MediaLinkageWithoutTiming) (E544) and\ncorresponds to CLAN CHECK error 124 (\"remove \\\"unlinked\\\" from @Media\nheader\")."
kind = "Invalidity"
status = "implemented"

