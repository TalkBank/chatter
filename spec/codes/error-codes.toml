[[code]]
code = "E544"
variant = "MediaLinkageWithoutTiming"
summary = "`@Media` header declares linkage (no `unlinked` / `missing` /\n`notrans` status) but the transcript carries no timing evidence\n(no bullets on any utterance, no `%wor` bullets, no `@Bg`/`@Eg`\ntime range). Reinstates the legacy CHAT validation check."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E545"
variant = "InvalidBirthDateFormat"
summary = "Invalid `@Birth of` date format, must match `DD-MMM-YYYY`\nper CLAN `depfile.cut`'s `@d<dd-lll-yyyy>` template."
kind = "Invalidity"
