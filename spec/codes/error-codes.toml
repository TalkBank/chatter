[[code]]
code = "E729"
variant = "BulletOverlap"
summary = "Bullet start time overlaps with previous tier's end time (CLAN Error 84).\n\nCurrent tier's BEG is less than the previous tier's END, indicating\noverlapping timing. Unlike speaker self-overlap (E704), this applies\nacross different speakers."
kind = "Invalidity"
status = "not_implemented"

[[code]]
code = "E730"
variant = "BulletGap"
summary = "Bullet timing gap exceeds threshold (CLAN Error 85).\n\nGap between current tier's BEG and previous tier's END exceeds the\nacceptable discontinuity threshold. Only reported in bullet consistency\nmode (`+c0`)."
kind = "Invalidity"
status = "not_implemented"

[[code]]
code = "E731"
variant = "SpeakerBulletSelfOverlap"
summary = "Speaker's bullet start time is before their own previous bullet end time\n(CLAN Error 133).\n\nSupplements the overlap-marker-based E704 with actual bullet timing\ncheck for same-speaker self-overlap."
kind = "Invalidity"
status = "not_implemented"

[[code]]
code = "E732"
variant = "MissingBullet"
summary = "Missing bullet on tier when bullet consistency mode is active (CLAN Error 110).\n\nWhen `+c0` or `+c1` is specified, every main tier must have timing."
kind = "Invalidity"
status = "not_implemented"

[[code]]
code = "E733"
variant = "ModCountMismatchTooFew"
summary = "`%mod` tier has fewer words than main tier.\n\nThe model-phonology tier (`%mod`) has fewer alignable tokens than the\nmain-tier words. Each main-tier word must have a corresponding `%mod`\ntoken. This code is separate from E714 (`%pho`) because the two tiers\nrepresent distinct phonological layers."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E734"
variant = "ModCountMismatchTooMany"
summary = "`%mod` tier has more words than main tier.\n\nThe model-phonology tier (`%mod`) has more alignable tokens than the\nmain-tier words. Remove the extra `%mod` tokens so counts match.\nThis code is separate from E715 (`%pho`) for the same reason as E733."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E735"
variant = "SylUnitMalformed"
summary = "A `%xmodsyl` / `%xphosyl` syllabification unit is not a `phone:CODE` pair.\n\nA unit must be one IPA phone, an ASCII `:`, then a single constituent\ncode. A unit with no `:`, an empty phone, or an empty code is invalid."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E736"
variant = "SylIllegalConstituentCode"
summary = "A `%xmodsyl` / `%xphosyl` constituent code is not one of `O N C L R E A D U`.\n\n`U` (unknown) is legal: Phon emits it when a phone has no concrete\nsyllable constituent. Boundary (`B`), stress (`S`), word (`W`) and tone\n(`T`) are never emitted on the syllabification tiers."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E737"
variant = "ModsylReconstructionMismatch"
summary = "`%xmodsyl` does not reproduce its `%mod` word.\n\nStripping the `:CODE` from every unit and concatenating the phones must\nequal the corresponding `%mod` word exactly."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E738"
variant = "PhosylReconstructionMismatch"
summary = "`%xphosyl` does not reproduce its `%pho` word.\n\nStripping the `:CODE` from every unit and concatenating the phones must\nequal the corresponding `%pho` word exactly."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E739"
variant = "PhoalnPairMalformed"
summary = "A `%xphoaln` alignment pair is malformed.\n\nEvery pair must contain exactly one `↔` with a non-empty side on each\nside (use `∅` for a null); a pair of `∅↔∅` is invalid."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E740"
variant = "PhoalnModReconstructionMismatch"
summary = "`%xphoaln` model sides do not reproduce the `%mod` word.\n\nConcatenating the left element of each pair, skipping `∅`, must equal the\ncorresponding `%mod` word exactly."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E741"
variant = "PhoalnPhoReconstructionMismatch"
summary = "`%xphoaln` actual sides do not reproduce the `%pho` word.\n\nConcatenating the right element of each pair, skipping `∅`, must equal the\ncorresponding `%pho` word exactly."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E742"
variant = "XphointBulletInvalid"
summary = "A `%xphoint` time bullet has `start >= end`.\n\nEach phone interval's start offset must be strictly less than its end."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E743"
variant = "XphointIntervalNotMonotonic"
summary = "`%xphoint` interval start times are not non-decreasing.\n\nEach interval's start must be greater than or equal to the previous\ninterval's start across the whole tier."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E744"
variant = "XphointMediaBoundsViolation"
summary = "`%xphoint` intervals fall outside the record's media interval.\n\nThe first interval's start and last interval's end must lie within the\n`*SPK:` line's media bullet (subject to 1 ms rounding tolerance)."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E745"
variant = "XphointPhoneReconstructionMismatch"
summary = "`%xphoint` group phones do not reproduce the `%pho` word.\n\nConcatenating a group's phones, in order, must equal the corresponding\n`%pho` word exactly."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E746"
variant = "XphointGroupCountMismatch"
summary = "`%xphoint` group count does not match the `%pho` word count.\n\nThere must be exactly one ` / `-separated group per `%pho` word."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E747"
variant = "BlankLineNotAllowed"
summary = "A blank line in the transcript.\n\nCHAT does not allow blank lines anywhere in the transcript (CLAN CHECK\n91). The grammar represents a blank line as a structural `blank_line`\nnode (the single-break `newline` token no longer fuses consecutive\nnewlines), so the parser emits this from the tree, not by scanning the\nsource text."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E748"
variant = "LeadingZeroBulletTime"
summary = "A media bullet timestamp written with a leading zero before another\ndigit (e.g. `\\u{15}012_200\\u{15}`).\n\nBullet times are plain millisecond integers; CLAN CHECK rejects a\ncomponent matching `0[0-9]` as an \"Illegal time representation inside\na bullet.\" (CHECK 90). A bare `0` component is legal. Detected at\nparse time because the leading zero exists only in the source text\n(the model stores `u64` milliseconds); the bullet's numeric value\nstill parses, so the AST keeps the bullet while the diagnostic makes\nthe file invalid."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E749"
variant = "CommaGluedToNextWord"
summary = "A comma glued to the word that follows it (`hey ,you`).\n\nA comma on a speaker tier must be followed by a space or\nend-of-line (CLAN CHECK 92). Detected by span adjacency over the\nin-order content walk: the rule fires only when the next item is\na word starting at the byte immediately after the comma, so\nexempt constructs that put any other character there (group `<`,\noverlap and CA marks) are naturally not flagged."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E750"
variant = "SpaceInsideAngleGroup"
summary = "A space directly after the opening `<` or directly before the\nclosing `>` of an angle-bracket group (`< dog>` / `<dog >`).\n\nGroup delimiters hug their content (CLAN CHECK 160). The grammar\ntolerates the whitespace as an explicit optional `whitespaces`\nCST node so the parse recovers; this diagnostic marks the file\ninvalid instead of silently dropping the space (which also\nsilently rewrote the text on normalize)."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E751"
variant = "PauseGluedToWord"
summary = "A pause marker glued to the end of the preceding word\n(`hello(.)`).\n\nPauses are free-standing, space-delimited items (CLAN CHECK 57).\nDetected by span adjacency over the in-order content walk: the\npause's span starts at the byte where the previous word's span\nends."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E752"
variant = "TimingWithoutMedia"
summary = "Transcript carries timing evidence (a main-tier bullet or an\nactual recorded `%wor` bullet) but no `@Media` header declares the\nmedia timeline the timestamps index. Equal word counts without a\nbullet are not timing evidence. Inverse direction of\n[`MediaLinkageWithoutTiming`](Self::MediaLinkageWithoutTiming)\n(E544); corresponds to CLAN CHECK error 112."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E753"
variant = "WordOnlyRepetitionSegments"
summary = "Word consists only of a repetition segment: every material part\nsits inside `↫...↫` (U+21AB) segment-repetition delimiters with no\nstem outside. The notation marks a repeated segment OF a word, so\na fully wrapped word asserts a repetition of nothing. Adopted from\nGUI CLAN CHECK error 151 as a chatter-authority rule; a\nword-category prefix marker (`&-` filler etc.) counts as a stem."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E755"
variant = "UndeclaredUtteranceLanguage"
summary = "A `[- CODE]` utterance-level language is not declared in\n`@Languages`. Utterance-level presence is substantial, unlike a\nword-level `@s:CODE` insertion, which deliberately carries no\ndeclaration requirement (2026-07-15 ruling). Matches CLAN CHECK\nerror 152."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E756"
variant = "EmptyDependentTier"
summary = "User-defined `%x` tier has empty or whitespace-only content: the\nline declares an annotation that is not there. Formerly W601 (which\nfired as a hard error despite the warning prefix); renumbered\n2026-07-16, rejection unchanged."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E757"
variant = "CodeGluedToFollowingContent"
summary = "Bracketed code's closing `]` glued to the following content with\nno space (`hello [/]x`). Style rule; the parse is unambiguous but\ncodes are free-standing space-delimited items. Matches CLAN CHECK\nerror 19."
kind = "Style"
status = "implemented"

[[code]]
code = "E758"
variant = "LeadingSpaceOnMainTier"
summary = "Space between the tier's tab delimiter and the first content item\nin a file WITHOUT `@Options: CA` (`*CHI:<tab><space>dog .`). CA\ntranscripts legitimately column-align with spaces after the tab\n(all 457 wild occurrences are CA files, 2026-07-16 scan), so the\nCA option exempts the rule. Matches CLAN CHECK error 123."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E759"
variant = "AnnotationAtUtteranceStart"
summary = "Utterance content begins with a postfix annotation (retrace,\noverlap marker, replacement, or quotation code): the code scopes\nover PRECEDING material, and there is none, so the parse is\ngenuinely broken and the error analysis names it instead of\nfalling through to the E316 catch-all. Matches CLAN CHECK\nerror 52 (\"Item '%s' must be preceded by text.\")."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E760"
variant = "MorItemEmptyPos"
summary = "`%mor` item beginning with the `|` separator (`|we`): the\npart-of-speech field is empty, which is never meaningful %mor\ncontent. Modern reading of CLAN CHECK error 11 (\"Symbol is not\ndeclared in the depfile.\"): the invariant is a non-empty symbol\nbefore the pipe, not the legacy depfile mechanism."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E761"
variant = "GraRelationHeadNotUniversal"
summary = "`%gra` relation label whose HEAD is not one of Universal\nDependencies' 37 universal relations (`13|3|PUNCTT`, `4|2|IOB`).\n\nA label is `HEAD` or `HEAD-SUBTYPE`. UD fixes the head set and\ndeliberately leaves subtypes open and language-specific, so the\nhead is the only part of a label checkable against a closed\nvocabulary; subtypes are never checked.\n\nNothing validated relation labels before, in chatter or in CLAN\nCHECK, so a corrupted label rode silently into every downstream\nanalysis. Grounding for the closed set (full-corpus survey,\n2026-07-26, 106,158 files, 138,565,864 relation instances): all\n37 universal heads are attested, 150 distinct labels occur, and\nexactly three heads fall outside the set, `IOB` (146, a\ntruncation of `IOBJ`), `PAD` (5), and `PUNCTT` (1). Every\nlanguage-specific subtype passes untouched."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E762"
variant = "PrefixMarkerIllegalPosition"
summary = "The prefix marker `#` stands alone as a main-tier word, or opens\none (`# dog`, `#dog`).\n\nThe marker attaches to the END of the prefix it marks (`ha# kelev`),\nso neither position can be that construct, and `#` is not a word.\nLanguage-independent: no language writes either shape. Zero\nattestations corpus-wide (typed survey, 2026-07-26, over every\n`#`-bearing file), so nothing legitimate is affected."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E763"
variant = "PrefixMarkerLanguageNotAllowed"
summary = "Legally-positioned prefix marker `#` on a word whose RESOLVED\nlanguage does not use the marker (`sun#`, `sun#shine` in an\nEnglish utterance).\n\nWhat is gated is the marker's PRESENCE in the word, not its\nposition, exactly as the digits rule (`E220`) gates the presence\nof a digit. Position is [`PrefixMarkerIllegalPosition`]'s\nconcern, and a word rejected there is not reported here too.\n\nGated on the word's own computed language, again like `E220`,\nnever on the file's `@Languages` header: a language-marked word\ncarries its own language. Grounding (typed survey, 2026-07-26):\n70,654 of 70,668 attestations are Hebrew or Arabic; the\nremaining 14 are strays in seven other languages.\n\n[`PrefixMarkerIllegalPosition`]: Self::PrefixMarkerIllegalPosition"
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E764"
variant = "PrefixedFormGluedToPrecedingWord"
summary = "A `&`-prefixed form runs directly into the preceding word\n(`dog&-um`, `dog&~gaga`, `dog&+fr`).\n\n`&` cannot continue a word, so the shape parses as TWO words: the\nmissing space silently manufactures a word boundary that the\ntranscriber did not write and no other diagnostic reports. Style\nrule in the [`PauseGluedToWord`] / [`CodeGluedToFollowingContent`]\nfamily: the parse is unambiguous, which is exactly why the source\nmust be canonically spaced.\n\nGlued omission (`dog0is`) is a different shape and is not this\ncode: `0` is ordinary word text, so it yields ONE malformed word,\nalready rejected by `E220`.\n\nJuxtaposition-matrix cell 6, ruled REJECT 2026-07-18. Zero\nmain-tier attestations in the kept corpus at adoption.\n\n[`PauseGluedToWord`]: Self::PauseGluedToWord\n[`CodeGluedToFollowingContent`]: Self::CodeGluedToFollowingContent"
kind = "Style"
status = "implemented"

[[code]]
code = "E765"
variant = "SeparatorGluedToFollowingContent"
summary = "A separator, pause, or overlap marker runs directly into the item\nafter it (`:and`, `;;`, `(.)dog`, `⌈⌉`).\n\nEach is a free-standing main-tier item, so the next item takes a\nspace. Only this direction is invalid: trailing glue ONTO a word\n(`word↘`, `dog,`) is documented CHAT convention, and a word glued\nto a colon (`dog:`) is not two items at all (the colon fuses as\nprosodic lengthening).\n\nComma shapes keep their own codes and are not reported here too:\n`,dog` is `E749`, `,,` is `E258`.\n\nJuxtaposition-matrix cell 7, ruled REJECT 2026-07-18. The\nfollowing-side-only scope comes from the per-variant probe\n(2026-07-29): every `Separator` variant accepted glue on both\nsides beforehand, and all the ruled exceptions are trailing, so a\nclass-level rule would have rejected 30,790 attested CA arrow\nusages."
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E766"
variant = "LinkerNotUtteranceInitial"
summary = "A linker (`+\"`, `++`, `+<`, `+^`, `+,`, `+≈`, `+≋`) placed after\nutterance content. Linkers are utterance-initial by definition\n(they connect this utterance to the PREVIOUS one), so a linker in\ncontent position is meaningless.\n\nThe grammar deliberately parses the misplaced linker into the CST\n(same strict+catch-all pattern as [`IllegalCurlyQuote`]) so this\nnamed rule can locate it precisely; before that, the construct\nfell into ERROR-node recovery and surfaced as a generic `E316`\nthat gave the transcriber nothing to act on (IISRP residue\nfinding 5, 2026-07-30).\n\n[`IllegalCurlyQuote`]: Self::IllegalCurlyQuote"
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E767"
variant = "MediaWhitespaceBeforeComma"
summary = "Whitespace between the `@Media` filename and the comma after it.\n\nThe comma separates the filename from the media type, so the filename\nends where the comma begins. Real CLAN rejects the space too (CHECK\n148), and an unambiguous style violation still follows CHECK as an\nerror.\n\nThe construct parses deliberately, so this rule can name it and point at\nthe space. Before 2026-08-05 the header simply failed to match and the\nfailure surfaced as [`UnknownHeader`] plus a \"Missing media_type node\"\ncomplaint about a line that visibly ended in `, audio`: fallout rather\nthan a judgment, and misleading twice over.\n\n[`UnknownHeader`]: Self::UnknownHeader"
kind = "Invalidity"
status = "implemented"

[[code]]
code = "E768"
variant = "MediaFilenameNotRepresentable"
summary = "`@Media` filename cannot be written to a header and read back\nunchanged.\n\nThe problems are enumerated once, by `MediaFilenameProblem`; naming a\nsubset here is how this comment went stale on its first commit.\nUnreachable through either parser, which stop the filename at the\ncomma; the reachable path is a `ChatFile` deserialized from JSON."
kind = "Invalidity"
status = "unreachable_from_chat"

