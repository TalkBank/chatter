# There is deliberately NO `[workspace.lints]` table here, and the three
# members deliberately do not opt into one. That is a decision, not the
# silent-exemption bug the root workspace hit in August 2026, so it is written
# down where somebody will next go looking for it.
#
# The root workspace denies the panic family because a panic in the parser,
# model, CLI or LSP takes down something long-lived. Nothing here is long
# lived: `tools` and `runtime-tools` are build-time generators run by
# `just spec-gen`, and `vocabulary` is a library whose only consumers are those
# generators and two TEST crates. Measured 2026-08-26:
# `cargo tree -p chatter --edges normal | grep spec-vocabulary` finds nothing,
# so none of this reaches a shipped binary.
#
# Denying the family here would mean 77 findings, almost all `expect()` in a
# generator hitting a state its own inputs make impossible, where failing
# loudly at build time is the CORRECT behaviour and an `unwrap_or` would be the
# defect. Severity is still gated: `just clippy-spec` runs `-D warnings`, so
# every lint clippy raises by default is an error here.
[workspace]
members = ["tools", "runtime-tools", "vocabulary"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Franklin Chen <franklinchen@franklinchen.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TalkBank/chatter"

[workspace.dependencies]

# The spec format's vocabulary, shared with the OTHER cargo workspace.
talkbank-spec-vocabulary = { path = "vocabulary" }

# Error handling
anyhow = "1.0"

# CLI and file handling
clap = { version = "4.5", features = ["derive"] }
comrak = "0.50"
chrono = "0.4"


# Utilities
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tera = "1.20"
unicode-normalization = "0.1"

# Spec parsing
thiserror = "2.0"
toml = "1.0"
toml_edit = "0.25"

# Tree-sitter (for template generation - spec tools CAN use tree-sitter for parsing examples)
tree-sitter = "0.27.0"
tree-sitter-talkbank = { path = "../grammar" }
walkdir = "2.5"
oxc_allocator = "0.116.0"
oxc_ast = "0.116.0"
oxc_parser = "0.116.0"
oxc_span = "0.116.0"

# Runtime-aware spec tooling lives in `spec/runtime-tools`, separate from the
# core generation crate in `spec/tools`.
talkbank-model = { path = "../crates/talkbank-model" }
talkbank-parser = { path = "../crates/talkbank-parser" }

# macOS otherwise defaults to unpacked debug information. The generator-heavy
# workspace then leaves every codegen object in `target/debug/deps`, where even
# a warm `cargo test` must scan a directory that grows without a useful bound.
# `off` embeds the configured line tables in linked artifacts instead.
[profile.dev]
split-debuginfo = "off"
debug = "line-tables-only"

[profile.test]
split-debuginfo = "off"
debug = "line-tables-only"
