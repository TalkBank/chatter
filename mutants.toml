# cargo-mutants configuration.
#
# WHY THIS FILE IS HERE. It lived in the batchalign3 workspace until
# 2026-09-07, left behind when the CHAT core was extracted from that repo in
# 2026-05/06. Every function it excludes is defined here and none of them
# existed there any more, so the configuration described a tree it no longer
# applied to while this repo's own book pointed at a file that did not exist.
#
# SIZING `--jobs`. Each job runs a full workspace build, peaking around 8 GB.
# The failure mode is an out-of-memory kill during overlapping LINKER phases,
# not steady-state usage, so the safe number is lower than dividing total RAM
# by 8 suggests. Measure peak resident memory at a small `--jobs` before
# raising it. The previous fixed advice of `--jobs 1` was written for a 64 GB
# machine and is not a property of the tool.
#
# SCOPE. Prefer running against hand-written policy code, where a surviving
# mutant means a rule can be silently disabled:
#
#     cargo mutants -p talkbank-model --file 'src/validation/**' --timeout 180
#
# Running `-p talkbank-parser` unscoped spends most of its budget on generated
# code (`src/generated_traversal.rs` is over half that crate), where a mutant
# indicts the generator rather than this repository.

# Generated code. A surviving mutant here is a statement about the generator.
exclude_globs = ["crates/talkbank-parser/src/generated_traversal.rs"]

# Needs a whole file with `@Options: CA` in scope, so it cannot be reached from
# a unit test and every mutant survives for a reason that is not a test gap.
[[exclude_re]]
function = "find_context_dependent_ca_omission_span"

[[exclude_re]]
function = "report_context_dependent_main_tier_error"

# String identity, not behaviour.
[[exclude_re]]
function = "parser_name"
