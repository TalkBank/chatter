# cargo-mutants configuration.
#
# WHY THIS FILE IS HERE. It lived in the batchalign3 workspace until
# 2026-09-07, left behind when the CHAT core was extracted from that repo in
# 2026-05/06. Every function it excludes is defined here and none of them
# existed there any more, so the configuration described a tree it no longer
# applied to while this repo's own book pointed at a file that did not exist.
#
# SIZING. Choose build scope and concurrency for a deliberate experiment.
# Retain measured resource use with its tool/source/configuration identity;
# historical workspace memory estimates are not universal per-job limits.
#
# SCOPE. A survivor needs behavioral and test-selection review before it can
# establish a missing assertion. Exclusions below bound the experiment; they
# are not proof that the excluded code is correct. See the testing chapter.

# Generated code: investigate its producer and consumer contracts separately.
exclude_globs = ["crates/talkbank-parser/src/generated_traversal.rs"]

# Context-dependent CA behavior needs whole-file controls with @Options: CA.
# These exclusions do not establish that such controls cover every mutation.
[[exclude_re]]
function = "find_context_dependent_ca_omission_span"

[[exclude_re]]
function = "report_context_dependent_main_tier_error"

# String identity, not behaviour.
[[exclude_re]]
function = "parser_name"
